<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#00d4aa"/>
  <meta name="cache-control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="pragma" content="no-cache" />
  <meta http-equiv="expires" content="0" />
  <meta name="description" content="Campus navigation system for Integral University"/>

  <!-- STRICT AUTHENTICATION CHECK -->
  <script>
    try {
      const user = localStorage.getItem('nav_sys_user');
      const token = localStorage.getItem('nav_sys_token');
      
      if (!user || !token) {
        // Not authenticated - redirect immediately
        throw new Error('Not authenticated');
      }
      
      // Try to parse user data to verify it's valid
      JSON.parse(user);
    } catch (e) {
      // Clear any corrupted data
      localStorage.removeItem('nav_sys_user');
      localStorage.removeItem('nav_sys_token');
      localStorage.removeItem('nav_sys_timestamp');
      localStorage.removeItem('nav_sys_remember');
      // Redirect to login
      sessionStorage.setItem('redirect_after_login', window.location.pathname.split('/').pop() || 'app.html');
      window.location.href = 'index.html';
    }
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Campus Navigator"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.svg"/>
  <title>Integral University — Campus Navigator</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- ═══════════════════════════════════
       LOGIN WALL (shown if not authenticated)
  ═══════════════════════════════════ -->
  <div id="login-wall" class="hidden">
    <div class="login-wall-content">
      <p>Redirecting to login...</p>
    </div>
  </div>

  <!-- ═══════════════════════════════════
       USER MENU (top right)
  ═══════════════════════════════════ -->
  <div id="user-menu" class="hidden">
    <div class="user-menu-trigger" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">
      <span class="user-avatar">👤</span>
      <span class="user-name"></span>
    </div>
    <div class="user-menu-dropdown">
      <div class="user-menu-header">
        <div class="user-menu-avatar">👤</div>
        <div>
          <p class="user-menu-name"></p>
          <p class="user-menu-email"></p>
        </div>
      </div>
      <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 8px 0;"/>
      <button id="logout-btn" class="user-menu-btn">🚪 Logout</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════
       TOP CONTROL PANEL
  ═══════════════════════════════════ -->
  <div id="control-panel">
    <div id="panel-inner">

      <div id="brand">
        <span class="brand-dot"></span>
        <div class="brand-content">
          <span class="brand-text">Integral University</span>
          <span class="brand-sub">Campus Navigator</span>
        </div>
      </div>

      <div id="selectors">
        <div class="select-wrap">
          <label>FROM</label>
          <select id="start-select">
            <option value="">— Select Start —</option>
          </select>
        </div>

        <div id="swap-btn" title="Swap locations">⇄</div>

        <div class="select-wrap">
          <label>TO</label>
          <select id="end-select">
            <option value="">— Select Destination —</option>
          </select>
        </div>

        <button id="route-btn">
          <span class="btn-icon">▶</span>
          Navigate
        </button>

        <button id="clear-btn">✕</button>
        <button id="gps-btn" title="Use GPS">📍</button>
      </div>

    </div>
  </div>

  <!-- ═══════════════════════════════════
       MAP
  ═══════════════════════════════════ -->
  <div id="map"></div>

  <!-- ═══════════════════════════════════
       BOTTOM STATUS BAR
  ═══════════════════════════════════ -->
  <div id="status-bar">
    <div id="status-inner">
      <span id="status-icon">📍</span>
      <span id="status-text">Select a start and destination to find the shortest path.</span>
      <span id="status-dist" class="hidden"></span>
    </div>
  </div>

  <!-- ═══════════════════════════════════
       MOBILE NAVIGATION PANEL
  ═══════════════════════════════════ -->
  <div id="nav-panel" class="hidden">
    <div id="nav-inner">
      <div class="nav-header">
        <span class="nav-title">Navigation Active</span>
        <span class="nav-distance" id="nav-distance">-- m</span>
      </div>
      <div class="nav-direction">
        <span class="direction-arrow" id="direction-arrow">↑</span>
        <span class="direction-text" id="direction-text">Head towards your destination</span>
      </div>
      <div class="nav-controls">
        <button class="nav-btn stop" id="stop-nav-btn">Stop Navigation</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(() => {})
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
